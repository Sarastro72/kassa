<!DOCTYPE html>
<html lang="sv">
<head>
    <link rel="icon" type="image/png" href="static/cash-register.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Kundskärm">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#111111">
    <link rel="apple-touch-icon" href="static/cash-register.png">
    <link rel="manifest" href="static/manifest.webmanifest">
    <title>Kundskärm</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        #title {
            flex: 0 0 auto;
            font-size: 34px;
            text-align: center;
            padding: 16px 20px;
            background-color: #1c1c1c;
            border-bottom: 1px solid #333;
        }

        /* the only scrolling area, so the title stays put */
        #content {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
        }

        #pricelist {
            flex: 0 0 auto;
            padding: 4px 20px 20px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 24px;
            font-size: 26px;
            padding: 12px 4px;
            border-bottom: 1px solid #262626;
        }

        .price-row .price {
            white-space: nowrap;
            color: #ddd;
        }

        /* auto margins centre the pay view inside the scroll area */
        #payview {
            flex: 0 0 auto;
            margin: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        #amount {
            font-size: 56px;
            font-weight: bold;
            text-align: center;
        }

        #qr {
            background-color: white;
            border-radius: 10px;
            padding: 16px;
        }

        #qr canvas, #qr img {
            display: block;
            width: min(58vh, 80vw, 320px);
            height: auto;
            image-rendering: pixelated;
        }

        #message {
            flex: 0 0 auto;
            font-size: 22px;
            color: #999;
            text-align: center;
            margin: auto;
            padding: 20px;
        }

        #status {
            position: fixed;
            bottom: 8px;
            font-size: 14px;
            color: #e0a030;
        }

        #hint {
            position: fixed;
            top: 8px;
            font-size: 14px;
            color: #666;
        }

        .removed {
            display: none;
        }
    </style>
</head>
<body>
<div id="title"></div>
<div id="content">
    <div id="pricelist" class="removed"></div>
    <div id="payview" class="removed">
        <div id="amount"></div>
        <div id="qr"></div>
    </div>
    <div id="message" class="removed"></div>
</div>
<div id="status"></div>
<div id="hint" class="removed">Tryck för helskärm</div>

<script src="lib/qrcode.js"></script>

<script>
    const SESSION_KEY = 'pairSession'
    const SESSION_PARAM = 's'
    const HEX_ID = /^[0-9a-f]{8,64}$/

    const titleOut = document.getElementById('title');
    const amountOut = document.getElementById('amount');
    const qrOut = document.getElementById('qr');
    const payView = document.getElementById('payview');
    const priceList = document.getElementById('pricelist');
    const messageOut = document.getElementById('message');
    const statusOut = document.getElementById('status');
    const hintOut = document.getElementById('hint');

    let renderedQrUrl = null;
    let wakeLock = null;

    const sessionId = resolveSession();
    if (sessionId) {
        setMessage('Väntar på kassan…');
        connect(sessionId);
        keepAwake();
    } else {
        setMessage('Skanna parkopplings-QR i kassan');
    }

    function setMessage(text) {
        messageOut.textContent = text;
        messageOut.classList.toggle('removed', text === '');
    }

    function resolveSession() {
        const param = new URLSearchParams(window.location.search).get(SESSION_PARAM);
        if (param && HEX_ID.test(param)) {
            // deliberately left in the address bar: a home screen shortcut then
            // carries the id, which localStorage alone cannot guarantee on iOS
            localStorage.setItem(SESSION_KEY, param);
            return param;
        }
        return localStorage.getItem(SESSION_KEY);
    }

    function connect(id) {
        // EventSource reconnects on its own, no retry loop needed here
        const source = new EventSource(`/api/s/${id}`);
        source.addEventListener('open', () => statusOut.textContent = '');
        source.addEventListener('error', () => statusOut.textContent = 'Återansluter…');
        source.addEventListener('message', (e) => {
            statusOut.textContent = '';
            try {
                render(JSON.parse(e.data));
            } catch (err) {
                console.error("Kunde inte tolka state", err);
            }
        });
    }

    function render(state) {
        const paying = state.mode === 'pay';
        titleOut.textContent = state.title || 'Kassan';
        setMessage('');
        payView.classList.toggle('removed', !paying);
        priceList.classList.toggle('removed', paying);
        amountOut.textContent = paying ? `${state.amount} kr` : '';
        renderQr(paying ? state.swishUrl : null);
        if (!paying) {
            renderPriceList(state.products || []);
        }
    }

    function renderPriceList(products) {
        priceList.innerHTML = '';
        if (products.length === 0) {
            priceList.textContent = 'Inga produkter';
            return;
        }
        for (const product of products) {
            const row = document.createElement('div');
            row.className = 'price-row';
            const name = document.createElement('span');
            name.textContent = product.n;
            const price = document.createElement('span');
            price.className = 'price';
            price.textContent = `${formatPrice(product.p)} kr`;
            row.append(name, price);
            priceList.appendChild(row);
        }
    }

    // same rule as the register's product buttons: only show decimals when there are any
    function formatPrice(price) {
        return price % 1 === 0 ? price : price.toFixed(2);
    }

    function renderQr(url) {
        if (url === renderedQrUrl) {
            return;
        }
        renderedQrUrl = url;
        qrOut.innerHTML = '';
        qrOut.classList.toggle('removed', !url);
        if (!url) {
            return;
        }
        try {
            new QRCode(qrOut, {
                text: url,
                width: 320,
                height: 320,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        } catch (e) {
            console.error("Kunde inte skapa QR-kod", e);
            qrOut.classList.add('removed');
        }
    }

    // Requires a secure context, so the display must be opened over https.
    async function keepAwake() {
        await requestWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                // iOS releases the lock whenever the page is hidden
                requestWakeLock();
            }
        });
    }

    async function requestWakeLock() {
        if (!navigator.wakeLock || wakeLock || document.visibilityState !== 'visible') {
            return;
        }
        try {
            // The sentinel has to stay referenced. An unreferenced one can be garbage
            // collected, which silently releases the lock and the screen sleeps again.
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => {
                wakeLock = null;
                updateHint();
            });
        } catch (e) {
            // Safari grants this only from a user gesture, so the tap handler retries
            wakeLock = null;
            console.warn("Kunde inte hålla skärmen vaken", e);
        }
        updateHint();
    }

    function fullscreenSupported() {
        return !!document.documentElement.requestFullscreen && !isStandalone();
    }

    function isStandalone() {
        return window.navigator.standalone === true
            || window.matchMedia('(display-mode: fullscreen)').matches
            || window.matchMedia('(display-mode: standalone)').matches;
    }

    function wakeHint() {
        if (!window.isSecureContext) {
            return 'Öppna via https för att hålla skärmen tänd';
        }
        if (!navigator.wakeLock) {
            return 'Webbläsaren kan inte hålla skärmen tänd';
        }
        return wakeLock ? '' : 'Tryck på skärmen för att hålla den tänd';
    }

    // nothing is shown once the lock is held, so the hint doubles as a diagnostic
    function updateHint() {
        const hints = [wakeHint()];
        if (fullscreenSupported() && !document.fullscreenElement) {
            hints.push('Tryck för helskärm');
        }
        const text = hints.filter(Boolean).join(' · ');
        hintOut.textContent = text;
        hintOut.classList.toggle('removed', text === '');
    }

    document.addEventListener('fullscreenchange', updateHint);

    document.body.addEventListener('click', () => {
        requestWakeLock();
        if (fullscreenSupported() && !document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(e => console.warn(e));
        }
    });

    updateHint();
</script>
</body>
</html>

    <style>
        :root {
            --green: #4CAF50;
            --cyan: darkturquoise;

            --red: mediumvioletred;

        }

            margin: 0;
            display: flex;
            height: 100vh;
        }

        #info-bar {
            position: absolute;
            left: 0px;
            width: 100%;
            height: 50px;
            padding: 2px;
            background-color: #ddd;
            align-items: center;
            display: flex;
            justify-content: center;
            font-size: 24px;
        }

        #product-panel {
            position: absolute;
            left: 0px;
            top: 50px;
            bottom: 0px;
            width: 67%;
            padding: 10px;
            background-color: #f0f0f0;
        }

        #purchase-panel {
            position: absolute;
            right: 0px;
            top: 50px;
            bottom: 0px;
            width: 33%;
            padding: 10px;
            background-color: #ffffff;
            border-left: 2px solid #ccc;
            overflow-y: auto;
        }

        #products {
            width: 100%;

            padding: 0px;
            margin: 0px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
        }

        .product-button {
            font-size: 24px;
            padding: 20px;
            margin: 10px;
            flex: 0 0 30%;
            background-color: var(--green);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            text-shadow: 1px 1px 2px #000;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            touch-action: manipulation;
        }

        #add-product {
            position: absolute;
            right: 10px;
            bottom: 10px;
            font-size: 24px;
            padding: 10px;
            margin: 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        #product-dialog {

        }

        #info-bar button {

        table {

        dialog button {

        button.ok {

        button.pay-button {

        div.pay-header {

        div.amount-small {

        div.pay-info {

        div.share-status {

        .hidden {

    </style>
</head>

<!-- Use the remote qrcode script for a true standalone one-file solution -->
<!--script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
</script-->
<script src="lib/qrcode.js"></script>

<script>
    const EDIT_TIMEOUT = 1000
    const DATA_PARAM = 'data'
    const EMPTY_DATA = '{"p": [], "s": {}}'
    const PAIR_KEY = 'pair'

    const utf8Encoder = new TextEncoder();
    const utf8Decoder = new TextDecoder();
    const colors = ["green", "cyan", "blue", "purple", "red", "orange", "yellow", "brown"]

    const Product = class {
        constructor(name, price, color) {
            this.name = name;
            this.price = price;
            this.color = color;
        }

        brief() {
            console.log(this)
            return {n: this.name, p: this.price, c: colors.indexOf(this.color)}
        }

        static from(obj) {
            console.log(obj)
            return new Product(obj.n, obj.p, colors[obj.c] || "green");
        }
    }

    const editBtn = document.getElementById('edit-button');
    const settingsBtn = document.getElementById('settings-button');
    const title = document.getElementById('title');
    const productPanel = document.getElementById('products');
    const addProductBtn = document.getElementById('add-product');

    const purchaseBody = document.getElementById('purchase-body');
    const totalRow = document.getElementById('total');
    const totalSum = document.getElementById('total-sum');
    const payBtn = document.getElementById('pay');

    const qrDialog = document.getElementById('pay-dialog');
    const payHeader = document.getElementById('pay-header');
    const amountSmall = document.getElementById('amount-small');
    const payInfo = document.getElementById('pay-info');
    const numberOut = document.getElementById('number');
    const purchaseDoneBtn = document.getElementById('purchase-done');

    const productDialog = document.getElementById('product-dialog');
    const productNameInput = document.getElementById('product-name');
    const productPriceInput = document.getElementById('product-price');
    const createProductBtn = document.getElementById('create-product');

    const settingsDialog = document.getElementById('settings-dialog');
    const titleInput = document.getElementById('cashregister-name');
    const swishNumberInput = document.getElementById('swish-number');
    const swishMessageInput = document.getElementById('swish-message');
    const saveSettingsBtn = document.getElementById('save-settings');

    const shareBtn = document.getElementById('share-button');
    const shareDialog = document.getElementById('share-dialog');
    const shareQr = document.getElementById('share-qr');
    const shareUrlOut = document.getElementById('share-url');
    const shareStatus = document.getElementById('share-status');
    const copyShareUrlBtn = document.getElementById('copy-share-url');

    const pairBtn = document.getElementById('pair-button');
    const pairDialog = document.getElementById('pair-dialog');
    const pairQr = document.getElementById('pair-qr');
    const pairUrlOut = document.getElementById('pair-url');
    const pairStatus = document.getElementById('pair-status');
    const unpairBtn = document.getElementById('unpair-button');

    const fullscreenBtn = document.getElementById('fullscreen-button');
    const wakeStatus = document.getElementById('wake-status');

    let editTimer;
    let longPressFired = false;
    let productUnderEdit;
    let wakeLock = null;

    let data = loadData();
    let products = data.p.map(Product.from)
    let settings = data.s;
    console.log("products: " + JSON.stringify(products))
    console.log("settings: " + JSON.stringify(settings))

    let purchase = {};
    setTitle();
    renderProducts();
    updateFullscreenButton();
    requestWakeLock();

    document.addEventListener("keydown", (e) => {
        const keyName = e.key;
        switch (keyName) {
            case '+':
                showProductDialog();
                e.preventDefault();
                break;
        }
    });

    function objectToBase64(obj) {
        const bytes = utf8Encoder.encode(JSON.stringify(obj))
        let binString = '';
        for (const byte of bytes) {
            binString += String.fromCharCode(byte);
        }
        return btoa(binString);
    }

    function base64ToBase64Url(base64) {
        return base64
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/, '');
    }

    function base64UrlToBase64(value) {
        const base64 = value
            .replace(/-/g, '+')
            .replace(/_/g, '/');
        return base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
    }

    function loadData() {
        return importDataFromUrl() || storedData() || JSON.parse(EMPTY_DATA);
    }

    function storedData() {
        const stored = localStorage.getItem("data");
        if (!stored) {
            return null;
        }
        try {
            return base64ToObject(stored);
        } catch (e) {
            console.error("Kunde inte läsa sparad data", e);
            alert("Kunde inte läsa sparade produkter och inställningar. Spara inte över dem – ta en kopia av webbläsarens localStorage först.");
            return null;
        }
    }

    function isEmptyData(d) {
        return !d || ((d.p || []).length === 0 && Object.keys(d.s || {}).length === 0);
    }

    function importDataFromUrl() {
        const param = new URLSearchParams(window.location.search).get(DATA_PARAM);
        if (!param) {
            return null;
        }
        // drop the parameter immediately so a reload never re-imports
        history.replaceState(null, '', window.location.pathname + window.location.hash);
        let imported;
        try {
            imported = base64ToObject(base64UrlToBase64(param));
        } catch (e) {
            console.error("Kunde inte tolka data i länken", e);
            imported = null;
        }
        if (!imported || !Array.isArray(imported.p) || typeof imported.s !== 'object' || imported.s === null) {
            alert("Länken innehåller ingen giltig kassadata.");
            return null;
        }
        if (!isEmptyData(storedData())
            && !confirm("Skriv över nuvarande produkter och inställningar?")) {
            return null;
        }
        localStorage.setItem("data", objectToBase64(imported));
        return imported;
    }

    // Requires a secure context, so the register must be opened over https.
    async function requestWakeLock() {
        if (!navigator.wakeLock || wakeLock || document.visibilityState !== 'visible') {
            return;
        }
        try {
            // The sentinel has to stay referenced. An unreferenced one can be garbage
            // collected, which silently releases the lock and the screen sleeps again.
            wakeLock = await navigator.wakeLock.request('screen');
            wakeLock.addEventListener('release', () => wakeLock = null);
        } catch (e) {
            // Safari grants this only from a user gesture, so every tap retries
            wakeLock = null;
            console.warn("Kunde inte hålla skärmen vaken", e);
        }
    }

    function wakeStatusText() {
        if (!window.isSecureContext) {
            return 'Skärmen kan slockna – sidan är inte öppnad via https';
        }
        if (!navigator.wakeLock) {
            return 'Skärmen kan slockna – webbläsaren saknar stöd';
        }
        return wakeLock ? 'Skärmen hålls tänd' : 'Skärmen kan slockna – tryck på skärmen';
    }

    function isStandalone() {
        return window.navigator.standalone === true
            || window.matchMedia('(display-mode: fullscreen)').matches
            || window.matchMedia('(display-mode: standalone)').matches;
    }

    function fullscreenSupported() {
        // iPhone Safari has no Fullscreen API at all, there the home screen shortcut is the way
        return !!document.documentElement.requestFullscreen && !isStandalone();
    }

    function updateFullscreenButton() {
        fullscreenBtn.classList.toggle('removed', !fullscreenSupported());
    }

    fullscreenBtn.addEventListener('click', () => {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(e => console.warn(e));
        } else {
            document.documentElement.requestFullscreen().catch(e => console.warn(e));
        }
    });

    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('pointerdown', requestWakeLock, {passive: true});
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            // iOS releases the lock whenever the page is hidden
            requestWakeLock();
        }
    });

    // Kept under its own localStorage key, never inside "data", so the share
    // link (?data=…) cannot clone the pairing to another register.
    function pairing() {
        const stored = localStorage.getItem(PAIR_KEY);
        if (!stored) {
            return null;
        }
        try {
            return JSON.parse(stored);
        } catch (e) {
            console.error("Kunde inte läsa parkopplingen", e);
            return null;
        }
    }

    function createPairing() {
        // crypto.randomUUID is secure-context only and therefore missing on http://<ip>:5555
        const pair = {id: randomHex(), key: randomHex()};
        localStorage.setItem(PAIR_KEY, JSON.stringify(pair));
        return pair;
    }

    function randomHex() {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        return Array.from(bytes)
            .map(b => b.toString(16).padStart(2, '0'))
            .join('');
    }

    function displayUrl(pair) {
        const url = new URL(window.location.href);
        url.search = '';
        url.hash = '';
        return `${url.origin}/display?s=${pair.id}`;
    }

    function payState(mode) {
        const state = {mode: mode, title: settings.title || ''};
        if (mode === 'pay') {
            state.amount = totalPrice();
            if (settings.swishNumber) {
                state.swishUrl = swishUrl(state.amount);
            }
        }
        return state;
    }

    // fire and forget, the pay dialog must never wait for the network
    function publishState(mode) {
        const pair = pairing();
        if (!pair) {
            return;
        }
        fetch(`/api/s/${pair.id}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Kassa-Key': pair.key},
            body: JSON.stringify(payState(mode)),
            keepalive: true
        }).catch(e => console.error("Kunde inte uppdatera kundskärmen", e));
    }

    function shareUrl() {
        const url = new URL(window.location.href);
        url.search = '';
        url.hash = '';
        return `${url.href}?${DATA_PARAM}=${base64ToBase64Url(objectToBase64(currentData()))}`;
    }

    // Deliberately atob/btoa rather than Uint8Array.fromBase64/toBase64:
    // those only exist from Safari 18.2 and iPads on iOS 17 still have to work.
    function base64ToObject(base64) {
        const binString = atob(base64);
        const bytes = Uint8Array.from(binString, c => c.charCodeAt(0));
        return JSON.parse(utf8Decoder.decode(bytes))
    }

    function findProduct(name) {
        for (const prod of products) {
            if (prod.name.toLowerCase() === name.toLowerCase()) {
                return prod
            }
        }
        return null;
    }

    function showProductDialog() {
        productNameInput.value = '';
        productPriceInput.value = '';
        document.querySelector(`input.green`).checked = true
        productDialog.showModal();
    }

    function editProduct(name) {
        editTimer = null
        productUnderEdit = findProduct(name)
        productNameInput.value = productUnderEdit.name;
        productPriceInput.value = productUnderEdit.price;
        let color = productUnderEdit.color || 'green'
        document.querySelector(`input.${color}`).checked = true
        productDialog.showModal();
    }

    function showSettingsDialog() {
        titleInput.value = settings.title || '';
        swishNumberInput.value = settings.swishNumber || '';
        swishMessageInput.value = settings.swishMessage || '';
        wakeStatus.textContent = wakeStatusText();
        settingsDialog.showModal();
    }

    addProductBtn.addEventListener('click', () => {
        productUnderEdit = null
        showProductDialog();
        validateProductInput()
    });

    settingsBtn.addEventListener('click', () => {
        showSettingsDialog();
    });

    shareBtn.addEventListener('click', () => {
        showShareDialog();
    });

    function showShareDialog() {
        const url = shareUrl();
        shareUrlOut.textContent = url;
        shareStatus.textContent = '';
        shareQr.innerHTML = '';
        try {
            new QRCode(shareQr, {
                text: url,
                width: 320,
                height: 320,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        } catch (e) {
            console.error("Kunde inte skapa QR-kod", e);
            shareQr.innerHTML = '<span>För mycket data för QR-kod – använd länken</span>';
        }
        shareDialog.showModal();
    }

    function selectShareUrl() {
        const range = document.createRange();
        range.selectNodeContents(shareUrlOut);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
    }

    copyShareUrlBtn.addEventListener('click', async () => {
        // navigator.clipboard is unavailable over plain http, fall back to selecting the text
        if (!navigator.clipboard) {
            selectShareUrl();
            shareStatus.textContent = "Kopiera den markerade länken";
            return;
        }
        try {
            await navigator.clipboard.writeText(shareUrlOut.textContent);
            shareStatus.textContent = "Länk kopierad!";
        } catch (e) {
            console.error("Kunde inte kopiera länken", e);
            selectShareUrl();
            shareStatus.textContent = "Kopiera den markerade länken";
        }
    });

    pairBtn.addEventListener('click', () => {
        showPairDialog();
    });

    function showPairDialog() {
        const pair = pairing() || createPairing();
        const url = displayUrl(pair);
        pairUrlOut.textContent = url;
        pairStatus.textContent = '';
        pairQr.innerHTML = '';
        try {
            new QRCode(pairQr, {
                text: url,
                width: 320,
                height: 320,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
        } catch (e) {
            console.error("Kunde inte skapa QR-kod", e);
            pairQr.innerHTML = '<span>Kunde inte skapa QR-kod – använd länken</span>';
        }
        pairDialog.showModal();
        publishState('idle');
    }

    unpairBtn.addEventListener('click', () => {
        localStorage.removeItem(PAIR_KEY);
        pairDialog.close();
    });

    function validateProductInput() {
        const nameOk = productNameInput.value.trim().length > 0
        const priceOk = productPriceInput.value.trim().length > 0
        if (nameOk && priceOk) {
            createProductBtn.removeAttribute("disabled");
        } else {
            createProductBtn.setAttribute("disabled", "disabled");
        }
    }

    productNameInput.addEventListener('input', validateProductInput)
    productPriceInput.addEventListener('input', validateProductInput)

    function currentData() {
        return {
            p: products.map(p => p.brief()),
            s: settings
        }
    }

    function saveState() {
        data = currentData();
        localStorage.setItem("data", objectToBase64(data));
    }

    createProductBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const name = productNameInput.value.trim();
        const price = parseFloat(productPriceInput.value);
        const color = document.querySelector('input[name="color"]:checked').value
        if (name && !isNaN(price)) {
            let existing = productUnderEdit || findProduct(name)
            if (existing) {
                if (price > 0) {
                    existing.name = name;
                    existing.price = price;
                    existing.color = color;
                } else {
                    products = products.filter(function (p) {
                        return p.name !== existing.name
                    });
                }
            } else {
                products.push(new Product(name, price, color));
            }
            saveState()
            renderProducts();
            productDialog.close();
        }
    });

    saveSettingsBtn.addEventListener('click', (e) => {
        settings.title = titleInput.value.trim();
        settings.swishNumber = validSwishNumber(swishNumberInput.value.trim());
        settings.swishMessage = swishMessageInput.value.trim();
        setTitle();
        saveState()
        publishState('idle');
    });

    function setTitle() {
        if (settings.title) {
            const titleValue = "Kassa – " + settings.title
            document.title = titleValue;
            title.textContent = titleValue;
        } else {
            document.title = "Kassan";
            title.textContent = "Kassan";
        }
    }

    function validSwishNumber(number) {
        number = number.replace(/\D/g, "");
        if (number.length != 10) {
            number = ""
        }
        return number;
    }

    function swishUrl(amount) {
        const message = encodeURIComponent(settings.swishMessage)
        return `https://app.swish.nu/1/p/sw/?sw=${settings.swishNumber}&amt=${amount}&cur=SEK&msg=${message}&src=qr`
    }

    function formatSwishNumber() {
        number = settings.swishNumber;
        if (number && number.length == 10) {
            number = number.substring(0, 3) + "-"
                + number.substring(3, 6) + " "
                + number.substring(6, 8) + " "
                + number.substring(8);
        }
        return number;
    }

    qrDialog.addEventListener('close', () => publishState('idle'));

    purchaseDoneBtn.addEventListener('click', (e) => {
        e.preventDefault();
        purchase = {};
        renderPurchase();
        qrDialog.close();
    });

    payBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const amount = totalPrice();
        publishState('pay');
        qrDialog.showModal();
        payHeader.textContent = `${settings.title || ''}`;
        payInfo.innerHTML = '';
        if (settings.swishNumber) {
            amountSmall.classList.remove("removed");
            amountSmall.textContent = `${amount} kr`;
            const url = swishUrl(amount);
            new QRCode(payInfo, {
                text: url,
                width: 320,
                height: 320,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.L
            });
            numberOut.textContent = formatSwishNumber();
        } else {
            amountSmall.classList.add("removed");
            payInfo.innerHTML = `<span>Att betala</span>
                <span class="amount-large">${amount} kr</span>`
        }
    });

    function addToPurchase(name, price) {
        if (longPressFired) {
            // long press already opened the edit dialog for this press
            return;
        }
        cancelEditTimer();
        if (purchase[name]) {
            purchase[name].quantity += 1;
        } else {
            purchase[name] = {price: price, quantity: 1};
        }
        renderPurchase();
    }

    function renderPurchase() {
        purchaseBody.innerHTML = '';
        let total = 0;
        for (const [name, data] of Object.entries(purchase)) {
            const row = document.createElement('tr');
            const totalPrice = data.price * data.quantity;
            total += totalPrice;

            row.innerHTML = `
                    <td>${name}</td>
                    <td>${data.quantity}</td>
                    <td>${data.price.toFixed(2)}</td>
                    <td>${totalPrice.toFixed(2)}</td>
                    <td><button class="delete-button" onclick="deleteProduct('${name}')">🗑️</button></td>
                `;
            purchaseBody.appendChild(row);
        }
        totalSum.textContent = total.toFixed(2);
        if (Object.keys(purchase).length === 0) {
            payBtn.setAttribute("disabled", "disabled");
            totalRow.classList.add('hidden');
        } else {
            payBtn.removeAttribute("disabled");
            totalRow.classList.remove('hidden');
        }
    }

    function startEditTimer(name) {
        cancelEditTimer();
        longPressFired = false;
        editTimer = setTimeout(
            () => {
                longPressFired = true;
                editProduct(name);
            },
            EDIT_TIMEOUT
        )
    }

    function cancelEditTimer() {
        if (editTimer) {
            clearTimeout(editTimer)
            editTimer = null
        }
    }

    function renderProducts() {
        // const btn = document.createElement('button')
        productPanel.innerHTML = '';
        for (const product of products) {
            const name = product.name
            const price = product.price
            const color = product.color || 'green'
            let priceStr = price
            if (price % 1 !== 0) {
                priceStr = price.toFixed(2)
            }
            const btn = document.createElement('button');
            btn.className = `product-button ${color}`;
            btn.textContent = name + ', ' + priceStr + 'kr';
            btn.dataset.name = name;
            btn.dataset.price = price;
            btn.addEventListener('pointerdown', () => startEditTimer(name));
            btn.addEventListener('pointercancel', cancelEditTimer);
            btn.addEventListener('pointerleave', cancelEditTimer);
            btn.addEventListener('contextmenu', e => e.preventDefault());
            btn.addEventListener('click', () => addToPurchase(name, price));
            productPanel.appendChild(btn);
        }
    }

    function totalPrice() {
        let total = 0;
        for (const [name, data] of Object.entries(purchase)) {
            const totalPrice = data.price * data.quantity;
            total += totalPrice;
        }
        return total.toFixed(2);
    }

    function deleteProduct(name) {
        delete purchase[name];
        renderPurchase();
    }
</script>
</body>
</html>
